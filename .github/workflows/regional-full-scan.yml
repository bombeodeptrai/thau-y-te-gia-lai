name: Khởi tạo và quét sâu dữ liệu miền Trung

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: regional-data
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[central-full-scan]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region:
          - thanh-hoa
          - nghe-an
          - ha-tinh
          - quang-tri
          - hue
          - da-nang
          - quang-ngai
          - gia-lai
          - dak-lak
          - khanh-hoa
          - lam-dong
    steps:
      - name: Lấy mã nguồn và dữ liệu đã lưu
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra cấu hình ${{ matrix.region }}
        env:
          DRY_RUN: "1"
        run: node scripts/run-region-scan.mjs "${{ matrix.region }}"

      # Lượt đầu chỉ quét theo mã tỉnh cũ và mới. Quét bù từ khóa địa danh
      # được tách sang workflow bổ sung để tránh quá tải nguồn công khai.
      - name: Quét nền toàn bộ 3 năm
        id: regional_scan
        continue-on-error: true
        env:
          SCAN_DAYS: "1095"
          INCREMENTAL_DAYS: "14"
          WINDOW_DAYS: "30"
          PAGE_SIZE: "10"
          DETAIL_LIMIT: "80"
          MIN_TENDER_COUNT: "1"
          ENABLE_HISTORICAL_FALLBACK: "0"
          FORCE_FULL_REFRESH: "1"
        run: node scripts/run-region-scan.mjs "${{ matrix.region }}"

      - name: Đóng gói dữ liệu tỉnh thành đã xác thực
        if: steps.regional_scan.outcome == 'success'
        run: |
          mkdir -p "data/regions/${{ matrix.region }}" artifacts
          printf '%s\n' "success" > "data/regions/${{ matrix.region }}/last-full-scan-status.txt"
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "data/regions/${{ matrix.region }}/last-full-scan-at.txt"
          tar -czf "artifacts/${{ matrix.region }}.tgz" "data/regions/${{ matrix.region }}"

      - name: Lưu dữ liệu tỉnh thành đã xác thực
        if: steps.regional_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: full-region-${{ matrix.region }}
          path: artifacts/${{ matrix.region }}.tgz
          retention-days: 3
          if-no-files-found: error

  merge-and-deploy:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[central-full-scan]')
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn mới nhất và toàn bộ lịch sử
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Khôi phục dữ liệu Gia Lai nếu bản hiện tại bị rỗng
        run: node scripts/restore-legacy-gia-lai.mjs

      - name: Tải dữ liệu các tỉnh quét thành công
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: full-region-*
          path: artifacts
          merge-multiple: true

      - name: Giải nén và hợp nhất dữ liệu
        run: |
          if compgen -G "artifacts/*.tgz" > /dev/null; then
            for archive in artifacts/*.tgz; do
              tar -xzf "$archive"
            done
          else
            echo "Không có tỉnh nào quét thành công; giữ dữ liệu gần nhất."
          fi
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node -e 'const d=require("./data/tenders.json"); if (!d.tenders?.length) throw new Error("Từ chối triển khai cơ sở dữ liệu rỗng");'

      - name: Ghi cơ sở dữ liệu 3 năm an toàn về repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Dữ liệu không thay đổi"
          else
            git commit -m "data: hoàn tất nền 3 năm miền Trung [start-detail-backfill] [skip central scan]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Kiểm tra và tạo website
        run: |
          node --test scripts/technical-requirements.test.mjs
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/build-site.mjs

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Tải bản tĩnh lên Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
