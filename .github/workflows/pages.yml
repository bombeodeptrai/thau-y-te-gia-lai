name: Triển khai giao diện GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Cập nhật nhanh gói mới và hồ sơ chính thức Gia Lai
      - Cập nhật dự phòng dữ liệu Gia Lai
      - Kiểm tra chéo chống lọt gói Gia Lai
      - Bổ sung chi tiết nhà thầu thiết bị và model Gia Lai
      - Khởi tạo và quét sâu dữ liệu miền Trung
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn và lịch sử dữ liệu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra mã nguồn
        run: |
          node --test scripts/technical-requirements.test.mjs
          node --check scripts/run-region-scan.mjs
          node --check scripts/restore-legacy-gia-lai.mjs
          node --check scripts/merge-regions.mjs
          node --check scripts/build-pages.mjs
          node --check scripts/build-site.mjs
          node --check scripts/patch-regional-competitor.mjs
          node --check regional-mode.js
          node --check competitor-analysis.js
          node --check competitor-count-fix.js
          cp google-apps-script/RegionalSheets.gs /tmp/RegionalSheets.js
          node --check /tmp/RegionalSheets.js
          DRY_RUN=1 node scripts/run-region-scan.mjs gia-lai

      - name: Khôi phục dữ liệu Gia Lai nếu bản hợp nhất bị rỗng
        run: node scripts/restore-legacy-gia-lai.mjs

      - name: Chuẩn hóa dữ liệu vùng hiện có
        run: |
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs

      - name: Tạo bản tĩnh
        run: node scripts/build-site.mjs

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Tải bản tĩnh lên Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
