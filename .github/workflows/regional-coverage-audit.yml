name: Kiểm tra chéo chống lọt gói thầu

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: regional-data
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[coverage-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region:
          - thanh-hoa
          - nghe-an
          - ha-tinh
          - quang-tri
          - hue
          - da-nang
          - quang-ngai
          - gia-lai
          - dak-lak
          - khanh-hoa
          - lam-dong
    steps:
      - name: Lấy mã nguồn và dữ liệu gần nhất
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra cú pháp các lớp chống lọt
        run: |
          node --check scripts/fetch-recent-location-audit.mjs
          node --check scripts/fetch-recent-medical-rescue.mjs
          node --test scripts/medical-scope.test.mjs

      # Đường quét theo địa danh độc lập với locations.provCode.
      - name: Đối chiếu 30 ngày bằng toàn bộ địa danh ${{ matrix.region }}
        id: location_audit
        continue-on-error: true
        env:
          AUDIT_DAYS: "30"
          PAGE_SIZE: "50"
        run: node scripts/fetch-recent-location-audit.mjs "${{ matrix.region }}"

      # Đường thứ hai đọc toàn bộ bản ghi theo mã tỉnh rồi áp dụng bộ nhận diện y tế mới.
      # Đây là lớp bắt các gói hóa chất trên máy miễn dịch, ELISA, HbA1C...
      - name: Cứu hộ độc lập các gói y tế bị bộ lọc cũ bỏ sót
        id: medical_rescue
        continue-on-error: true
        env:
          RESCUE_DAYS: "30"
          PAGE_SIZE: "100"
        run: node scripts/fetch-recent-medical-rescue.mjs "${{ matrix.region }}"

      - name: Đóng gói dữ liệu đã qua lớp cứu hộ
        if: steps.medical_rescue.outcome == 'success'
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/${{ matrix.region }}.tgz" "data/regions/${{ matrix.region }}"

      - name: Lưu dữ liệu đối chiếu
        if: steps.medical_rescue.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: audited-region-${{ matrix.region }}
          path: artifacts/${{ matrix.region }}.tgz
          retention-days: 2
          if-no-files-found: error

  merge-and-deploy:
    if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[coverage-audit]'))
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn và toàn bộ lịch sử
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tải các tỉnh đã đối chiếu thành công
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: audited-region-*
          path: artifacts
          merge-multiple: true

      - name: Hợp nhất mà không làm mất dữ liệu cũ
        run: |
          if compgen -G "artifacts/*.tgz" > /dev/null; then
            for archive in artifacts/*.tgz; do
              tar -xzf "$archive"
            done
          else
            echo "Không có dữ liệu cứu hộ thành công; giữ nguyên cơ sở dữ liệu gần nhất."
          fi
          node scripts/restore-legacy-gia-lai.mjs
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/data-health-check.mjs

      - name: Ghi kết quả đối chiếu về repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Đối chiếu không phát hiện gói mới"
          else
            git commit -m "data: bổ sung gói qua đối chiếu địa danh và cứu hộ y tế [skip central scan]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dựng website từ dữ liệu đã kiểm tra
        run: |
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/data-health-check.mjs
          node scripts/build-site.mjs

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Tải bản tĩnh lên Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
