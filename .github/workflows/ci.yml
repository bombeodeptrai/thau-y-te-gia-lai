name: Kiểm tra mã nguồn

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn và lịch sử dữ liệu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra cú pháp và bộ trích dữ liệu
        run: |
          node --test scripts/technical-requirements.test.mjs
          node --test scripts/medical-scope.test.mjs
          node --check scripts/run-region-scan.mjs
          node --check scripts/fetch-recent-location-audit.mjs
          node --check scripts/fetch-recent-medical-rescue.mjs
          node --check scripts/apply-manual-tender-overrides.mjs
          node --check scripts/restore-legacy-gia-lai.mjs
          node --check scripts/merge-regions.mjs
          node --check scripts/build-pages.mjs
          node --check scripts/build-site.mjs
          node --check scripts/patch-regional-competitor.mjs
          node --check scripts/data-health-check.mjs
          node --check scripts/validate-workflow-config.mjs
          node --check regional-mode.js
          node --check competitor-analysis.js
          node --check competitor-count-fix.js
          cp google-apps-script/RegionalSheets.gs /tmp/RegionalSheets.js
          node --check /tmp/RegionalSheets.js

      - name: Kiểm tra cấu hình workflow an toàn
        run: node scripts/validate-workflow-config.mjs

      - name: Kiểm tra cấu hình quét các tỉnh thành
        run: |
          for region in thanh-hoa nghe-an ha-tinh quang-tri hue da-nang quang-ngai gia-lai dak-lak khanh-hoa lam-dong; do
            DRY_RUN=1 node scripts/run-region-scan.mjs "$region"
          done

      - name: Khôi phục và dựng thử website miền Trung
        run: |
          node scripts/restore-legacy-gia-lai.mjs
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/data-health-check.mjs
          node scripts/build-site.mjs
          test -f dist-pages/index.html
          test -f dist-pages/data/region-coverage.json
          test -f dist-pages/regional-mode.js
          test -f dist-pages/data/regions/gia-lai/tenders.json
          node -e '
            const fs=require("fs");
            const need=["IB2600349751","IB2600348377","IB2600347689","IB2600346897"];
            for (const file of ["data/tenders.json","data/regions/gia-lai/tenders.json","dist-pages/data/regions/gia-lai/tenders.json"]) {
              const d=JSON.parse(fs.readFileSync(file,"utf8"));
              const got=new Set((d.tenders||[]).map(x=>String(x.notifyNo||"").replace(/-\d{2}$/, "")));
              const missing=need.filter(x=>!got.has(x));
              if(missing.length) throw new Error(`${file} còn thiếu ${missing.join(", ")}`);
              if(got.has("IB2600363942")) throw new Error(`${file} nhận nhầm gói điện lực`);
              console.log(`${file}: đủ 4 gói bắt buộc, không có gói điện lực`);
            }
          '
