name: Cập nhật nhanh dữ liệu miền Trung

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: regional-data
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[restore-data]') || contains(github.event.head_commit.message, '[scan-overlap]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        region:
          - thanh-hoa
          - nghe-an
          - ha-tinh
          - quang-tri
          - hue
          - da-nang
          - quang-ngai
          - gia-lai
          - dak-lak
          - khanh-hoa
          - lam-dong
    steps:
      - name: Lấy mã nguồn và dữ liệu đã lưu
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra bộ lọc và cấu hình ${{ matrix.region }}
        env:
          DRY_RUN: "1"
        run: |
          node --test scripts/medical-scope.test.mjs
          node --check scripts/fetch-recent-medical-rescue.mjs
          node scripts/run-region-scan.mjs "${{ matrix.region }}"

      - name: Quét chồng lấn 14 ngày gần nhất và giữ lịch sử 3 năm
        id: regional_scan
        continue-on-error: true
        env:
          SCAN_DAYS: "1095"
          INCREMENTAL_DAYS: "14"
          WINDOW_DAYS: "7"
          PAGE_SIZE: "10"
          DETAIL_LIMIT: "12"
          MIN_TENDER_COUNT: "1"
          ENABLE_HISTORICAL_FALLBACK: "0"
          FORCE_FULL_REFRESH: "0"
        run: node scripts/run-region-scan.mjs "${{ matrix.region }}"

      - name: Quét bù toàn bộ bản ghi gần đây rồi áp dụng cùng bộ lọc
        id: medical_rescue
        continue-on-error: true
        env:
          RESCUE_DAYS: "21"
          PAGE_SIZE: "100"
        run: node scripts/fetch-recent-medical-rescue.mjs "${{ matrix.region }}"

      - name: Đóng gói dữ liệu tỉnh thành hợp lệ
        if: steps.regional_scan.outcome == 'success' || steps.medical_rescue.outcome == 'success'
        run: |
          mkdir -p "data/regions/${{ matrix.region }}" artifacts
          printf '%s\n' "success" > "data/regions/${{ matrix.region }}/last-workflow-status.txt"
          tar -czf "artifacts/${{ matrix.region }}.tgz" "data/regions/${{ matrix.region }}"

      - name: Lưu dữ liệu tỉnh thành
        if: steps.regional_scan.outcome == 'success' || steps.medical_rescue.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region }}
          path: artifacts/${{ matrix.region }}.tgz
          retention-days: 2
          if-no-files-found: error

  merge-and-deploy:
    if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[restore-data]') || contains(github.event.head_commit.message, '[scan-overlap]'))
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn mới nhất và toàn bộ lịch sử
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Khôi phục dữ liệu Gia Lai nếu bản hiện tại bị rỗng
        run: node scripts/restore-legacy-gia-lai.mjs

      - name: Tải dữ liệu các tỉnh quét thành công
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: artifacts
          merge-multiple: true

      - name: Giải nén và hợp nhất dữ liệu
        run: |
          if compgen -G "artifacts/*.tgz" > /dev/null; then
            for archive in artifacts/*.tgz; do
              tar -xzf "$archive"
            done
          else
            echo "Không có artifact mới; giữ dữ liệu gần nhất."
          fi
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/data-health-check.mjs

      - name: Ghi cơ sở dữ liệu an toàn về repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Dữ liệu không thay đổi"
          else
            git commit -m "data: cập nhật bằng bộ lọc y tế thống nhất [skip central scan]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Tạo bản website từ dữ liệu mới
        run: |
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/data-health-check.mjs
          node scripts/build-site.mjs

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Tải bản tĩnh lên Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
