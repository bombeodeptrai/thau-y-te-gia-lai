name: Cập nhật dự phòng dữ liệu Gia Lai

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: regional-data
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[restore-data]') || contains(github.event.head_commit.message, '[scan-overlap]') || contains(github.event.head_commit.message, '[repair-official-details]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        region:
          - gia-lai
    steps:
      - name: Lấy mã nguồn và dữ liệu đã lưu
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra bộ lọc và cấu hình Gia Lai
        env:
          DRY_RUN: "1"
        run: |
          node --test scripts/medical-scope.test.mjs
          node --check scripts/repair-official-tender-identities.mjs
          node --check scripts/fetch-recent-medical-rescue.mjs
          node scripts/run-region-scan.mjs "${{ matrix.region }}"

      - name: Sửa định danh chính thức trước khi quét
        run: node scripts/repair-official-tender-identities.mjs "${{ matrix.region }}"

      - name: Quét chồng lấn 14 ngày gần nhất và giữ lịch sử 3 năm
        id: regional_scan
        continue-on-error: true
        env:
          SCAN_DAYS: "1095"
          INCREMENTAL_DAYS: "14"
          WINDOW_DAYS: "7"
          PAGE_SIZE: "10"
          DETAIL_LIMIT: "40"
          MIN_TENDER_COUNT: "1"
          ENABLE_HISTORICAL_FALLBACK: "0"
          FORCE_FULL_REFRESH: "0"
        run: node scripts/run-region-scan.mjs "${{ matrix.region }}"

      - name: Quét bù 21 ngày bằng mã tỉnh và địa danh
        id: medical_rescue
        continue-on-error: true
        env:
          RESCUE_DAYS: "21"
          PAGE_SIZE: "10"
          LOCATION_TERM_LIMIT: "16"
        run: node scripts/fetch-recent-medical-rescue.mjs "${{ matrix.region }}"

      - name: Xác nhận không còn gói thủ công
        run: |
          node -e '
            const d=require("./data/regions/gia-lai/tenders.json");
            const manual=(d.tenders||[]).filter(x=>x.manualTenderOverride || String(x.id||"").startsWith("manual-") || String(x.sourceStage||"").startsWith("manual"));
            if(manual.length) throw new Error(`Còn ${manual.length} gói thủ công`);
          '

      - name: Đóng gói dữ liệu Gia Lai hợp lệ
        if: steps.regional_scan.outcome == 'success' || steps.medical_rescue.outcome == 'success'
        run: |
          mkdir -p "data/regions/${{ matrix.region }}" artifacts
          printf '%s\n' "success" > "data/regions/${{ matrix.region }}/last-workflow-status.txt"
          tar -czf "artifacts/${{ matrix.region }}.tgz" "data/regions/${{ matrix.region }}"

      - name: Lưu dữ liệu Gia Lai
        if: steps.regional_scan.outcome == 'success' || steps.medical_rescue.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region }}
          path: artifacts/${{ matrix.region }}.tgz
          retention-days: 2
          if-no-files-found: error

  merge-and-deploy:
    if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[restore-data]') || contains(github.event.head_commit.message, '[scan-overlap]') || contains(github.event.head_commit.message, '[repair-official-details]'))
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn mới nhất và toàn bộ lịch sử
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Khôi phục dữ liệu Gia Lai nếu bản hiện tại bị rỗng
        run: node scripts/restore-legacy-gia-lai.mjs

      - name: Tải dữ liệu Gia Lai quét thành công
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: artifacts
          merge-multiple: true

      - name: Giải nén và hợp nhất dữ liệu
        run: |
          if compgen -G "artifacts/*.tgz" > /dev/null; then
            for archive in artifacts/*.tgz; do
              tar -xzf "$archive"
            done
          else
            echo "Không có artifact mới; giữ dữ liệu gần nhất."
          fi
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/data-health-check.mjs

      - name: Ghi cơ sở dữ liệu an toàn về repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Dữ liệu không thay đổi"
          else
            git commit -m "data: cập nhật dự phòng Gia Lai từ nguồn chính thức [skip central scan]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Tạo bản website từ dữ liệu mới
        run: |
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/data-health-check.mjs
          node scripts/build-site.mjs

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5

      - name: Tải bản tĩnh lên Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
