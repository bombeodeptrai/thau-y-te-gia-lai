name: Bổ sung chi tiết nhà thầu thiết bị và model Gia Lai

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[start-detail-backfill]') || contains(github.event.head_commit.message, '[repair-official-details]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        region:
          - gia-lai
    steps:
      - name: Lấy cơ sở dữ liệu mới nhất
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiểm tra tỉnh đã có dữ liệu nền
        id: eligibility
        shell: bash
        run: |
          FILE="data/regions/${{ matrix.region }}/tenders.json"
          if [ -f "$FILE" ] && node -e 'const d=require("./'"$FILE"'"); process.exit(d.tenders?.length ? 0 : 1)'; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.region }} chưa có dữ liệu nền; bỏ qua cho đến khi quét sâu thành công."
          fi

      - name: Sửa định danh chính thức trước khi tải chi tiết
        if: steps.eligibility.outputs.eligible == 'true'
        run: node scripts/repair-official-tender-identities.mjs "${{ matrix.region }}"

      - name: Tạo hồ sơ tối thiểu từ định danh chính thức
        id: official_detail_refresh
        if: steps.eligibility.outputs.eligible == 'true'
        continue-on-error: true
        env:
          DETAIL_LIMIT: "80"
        run: node scripts/refresh-official-tender-details.mjs "${{ matrix.region }}"

      - name: Bổ sung tối đa 80 hồ sơ đầy đủ, ưu tiên gói chưa có dữ liệu
        id: detail_scan
        if: steps.eligibility.outputs.eligible == 'true'
        continue-on-error: true
        env:
          SCAN_DAYS: "1095"
          INCREMENTAL_DAYS: "2"
          WINDOW_DAYS: "2"
          PAGE_SIZE: "10"
          DETAIL_LIMIT: "80"
          MIN_TENDER_COUNT: "1"
          ENABLE_HISTORICAL_FALLBACK: "0"
          FORCE_FULL_REFRESH: "0"
        run: node scripts/run-region-scan.mjs "${{ matrix.region }}"

      - name: Xác nhận dữ liệu chi tiết dùng định danh chính thức
        if: steps.official_detail_refresh.outcome == 'success' || steps.detail_scan.outcome == 'success'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const regionDir = 'data/regions/gia-lai';
          const data = JSON.parse(fs.readFileSync(path.join(regionDir, 'tenders.json'), 'utf8'));
          const manual = (data.tenders || []).filter((item) => item.manualTenderOverride || String(item.id || '').startsWith('manual-') || String(item.sourceStage || '').startsWith('manual'));
          if (manual.length) throw new Error(`Còn ${manual.length} gói thủ công`);
          const summaryPath = path.join(regionDir, 'official-identity-repair-summary.json');
          if (fs.existsSync(summaryPath)) {
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            for (const notifyNo of summary.repairedNotifyNos || []) {
              if (!fs.existsSync(path.join(regionDir, 'details', `${notifyNo}.json`))) {
                throw new Error(`${notifyNo} chưa có hồ sơ chi tiết`);
              }
            }
          }
          NODE

      - name: Đóng gói tỉnh bổ sung thành công
        if: steps.official_detail_refresh.outcome == 'success' || steps.detail_scan.outcome == 'success'
        run: |
          mkdir -p artifacts
          date -u +'%Y-%m-%dT%H:%M:%SZ' > "data/regions/${{ matrix.region }}/last-detail-backfill-at.txt"
          tar -czf "artifacts/${{ matrix.region }}.tgz" "data/regions/${{ matrix.region }}"

      - name: Lưu dữ liệu bổ sung
        if: steps.official_detail_refresh.outcome == 'success' || steps.detail_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: detail-region-${{ matrix.region }}
          path: artifacts/${{ matrix.region }}.tgz
          retention-days: 2
          if-no-files-found: error

  merge-data:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[start-detail-backfill]') || contains(github.event.head_commit.message, '[repair-official-details]')
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: regional-data-write
      cancel-in-progress: false
    steps:
      - name: Lấy repository mới nhất và lịch sử dự phòng
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Khôi phục dữ liệu nền nếu cần
        run: node scripts/restore-legacy-gia-lai.mjs

      - name: Tải dữ liệu Gia Lai bổ sung thành công
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: detail-region-*
          path: artifacts
          merge-multiple: true

      - name: Hợp nhất dữ liệu chi tiết
        run: |
          if compgen -G "artifacts/*.tgz" > /dev/null; then
            for archive in artifacts/*.tgz; do
              tar -xzf "$archive"
            done
          else
            echo "Chưa có hồ sơ chi tiết mới; giữ nguyên dữ liệu hiện tại."
          fi
          node scripts/merge-regions.mjs
          node scripts/apply-manual-equipment-overrides.mjs
          node scripts/data-health-check.mjs
          node -e 'const d=require("./data/tenders.json"); if (!d.tenders?.length) throw new Error("Từ chối ghi cơ sở dữ liệu rỗng");'

      - name: Ghi bổ sung về repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Không có chi tiết mới"
          else
            git commit -m "data: bổ sung hồ sơ chính thức nhà thầu thiết bị model [skip central scan]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
