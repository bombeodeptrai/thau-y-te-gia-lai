name: Giám sát lịch quét nhanh Gia Lai

on:
  push:
    branches:
      - main
  schedule:
    # Kiểm tra dày hơn lịch quét nhanh để một mốc cron watchdog bị bỏ qua
    # không làm dữ liệu chậm gần một giờ. Ngưỡng 25 phút bên dưới tạo
    # khoảng đệm để lượt chạy trễ vẫn gọi quét bù trước mốc 30 phút.
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure-rapid-scan:
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[watchdog-repair]') ||
      contains(github.event.head_commit.message, '[rapid-gia-lai]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chạy bù trước khi quét nhanh cũ quá 30 phút
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = "rapid-gia-lai-update.yml";
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              branch: "main",
              per_page: 10,
            });
            const runs = response.data.workflow_runs || [];
            const active = runs.find((run) => ["queued", "in_progress", "waiting", "requested", "pending"].includes(run.status));
            if (active) {
              core.info(`Quét nhanh #${active.id} đang ở trạng thái ${active.status}; không tạo lượt trùng.`);
              return;
            }

            const latest = runs[0];
            const latestAt = latest ? new Date(latest.run_started_at || latest.created_at).getTime() : 0;
            const ageMinutes = latestAt ? (Date.now() - latestAt) / 60_000 : Number.POSITIVE_INFINITY;
            if (ageMinutes <= 25) {
              core.info(`Quét nhanh gần nhất cách đây ${ageMinutes.toFixed(1)} phút; chưa cần chạy bù.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: "main",
            });
            core.notice(`Đã gọi quét bù vì lượt gần nhất đã cũ ${Number.isFinite(ageMinutes) ? ageMinutes.toFixed(1) : "không xác định"} phút.`);

      - name: Triển khai Pages nếu main mới hơn website
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            const mainSha = branch.data.commit.sha;
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: mainSha });
            const mainAt = new Date(
              commit.data.commit.committer?.date || commit.data.commit.author?.date || 0,
            ).getTime();

            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "pages.yml",
              branch: "main",
              per_page: 20,
            });
            const runs = response.data.workflow_runs || [];
            const active = runs.find((run) =>
              ["queued", "in_progress", "waiting", "requested", "pending"].includes(run.status));
            if (active) {
              core.info(`Pages #${active.id} đang ở trạng thái ${active.status}; không tạo lượt trùng.`);
              return;
            }

            const latestSuccess = runs.find((run) => run.conclusion === "success");
            const deployedAt = latestSuccess
              ? new Date(latestSuccess.run_started_at || latestSuccess.created_at).getTime()
              : 0;
            if (deployedAt >= mainAt) {
              core.info("Website đã được triển khai sau commit main mới nhất.");
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "pages.yml",
              ref: "main",
            });
            core.notice(`Đã gọi Pages vì commit ${mainSha.slice(0, 7)} chưa được triển khai.`);
